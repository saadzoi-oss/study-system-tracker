<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <meta
    name="color-scheme"
    content="light">

  <title>
    Study System • Study Coach
  </title>

  <link
    rel="stylesheet"
    href="styles.css?v=coach-20261006-2">
</head>

<body>

  <header class="masthead">

    <div class="brand">

      <span
        class="logo"
        aria-hidden="true">
        S
      </span>

      <div>
        <span class="eyebrow">
          STUDY SYSTEM
        </span>

        <h1>
          Study Coach
        </h1>
      </div>

    </div>

    <nav
      id="navigation"
      aria-label="Main navigation">
    </nav>

  </header>


  <main id="appRoot" tabindex="-1">

    <section class="card">

      <h2>
        Loading your saved classes…
      </h2>

      <p>
        Allow the page to finish loading.
        Do not clear your saved website data.
      </p>

    </section>

  </main>


  <aside class="sync-strip">

    <span
      id="syncStatus"
      role="status">
    </span>

    <button
      id="syncNow"
      class="text-button"
      type="button">
      Sync now
    </button>

  </aside>


  <p
    id="message"
    class="message"
    role="status"
    aria-live="polite">
  </p>


  <footer>

    Learn → Retrieval → Crosscheck → Assess.
    Anki is Stage 3 — Assess.

    <br>

    Keep a backup before clearing website data
    or changing devices.

    <br>

    <span id="coachVersion">
      Loading coaching version…
    </span>

  </footer>


  <dialog
    id="reflectionDialog"
    aria-labelledby="reflectionTitle">
  </dialog>


  <input
    id="backupInput"
    type="file"
    accept="application/json,.json"
    hidden>


  <noscript>
    <p>
      Enable JavaScript to use Study Coach.
    </p>
  </noscript>


  <!-- EXISTING CONFIGURATION -->
  <script
    src="config.js?v=coach-20261006-2">
  </script>


  <!-- EXISTING STUDY SYSTEM -->
  <script
    src="app.js?v=stable-code-20261013-2">
  </script>


  <!-- WEEKLY RHYTHM -->
  <script
    src="weekly-rhythm.js?v=weekly-rhythm-20261017-1">
  </script>


  <!-- FOCUSED PROGRESS -->
  <script
    src="progress-v2.js?v=focused-progress-20261016-4">
  </script>


  <!-- COACHING CONSISTENCY FIX -->
  <script
    src="coaching-consistency.js?v=coaching-consistency-20261017-1">
  </script>

</body>
</html>
