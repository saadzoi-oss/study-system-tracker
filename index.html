<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Study System • Study Coach</title>
  <link rel="stylesheet" href="styles.css?v=coach-20261006-2">

  <!--
    STUDY COACH — COACHING VIEW LAYOUT
    Presentation-only: no JavaScript added.
    No changes to data, coaching decisions, syncing, or sharing.
    Original Progress charts and weekly rhythm remain. New app.js supplies coaching.
  -->
  <style>
    /* Keep the important information in the first screenful. */
    #appRoot .fp-class-card {
      display: flex;
      flex-direction: column;
      gap: 0;
      padding: 1rem 1.1rem;
    }

    /* 1 — Class and total recorded study time. */
    #appRoot .fp-class-card > .fp-card-head {
      order: 0;
      align-items: flex-start;
      margin: 0 0 .65rem;
    }

    #appRoot .fp-class-card .fp-card-head h2 {
      margin: 0 0 .12rem;
      overflow-wrap: anywhere;
    }

    /* 2 — One activity-based recommendation from app.js. */
    #appRoot .fp-class-card > .fp-coach {
      order: 1;
      margin: 0;
      padding: .8rem .9rem;
    }

    #appRoot .fp-class-card .fp-verdict {
      line-height: 1.45;
    }

    #appRoot .fp-class-card .fp-coach p {
      line-height: 1.45;
      margin: .35rem 0 0;
    }

    #appRoot .fp-class-card .fp-next {
      margin-top: .6rem;
    }

    /*
      The original action container stays in the DOM for app.js
      and the existing share handler.
      Only its children's visual positions change.
    */
    #appRoot .fp-class-card > .fp-actions {
      display: contents;
    }

    /* 3 — Check-in and Start this step stay directly after advice. */
    #appRoot .fp-class-card > .fp-actions > button:not([data-fp-share]) {
      order: 2;
      align-self: flex-start;
      max-width: 100%;
      min-height: 2.4rem;
      margin: .55rem .45rem 0 0;
      white-space: normal;
      text-align: left;
    }

    /* 4 — Actual times, then the existing colored allocation bar. */
    #appRoot .fp-class-card > .fp-times {
      order: 3;
      margin: .95rem 0 .4rem;
    }

    #appRoot .fp-class-card > .fp-times::before {
      content: "RECORDED TIME BY STAGE";
      display: block;
      grid-column: 1 / -1;
      margin-bottom: .2rem;
      color: #34536b;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .045em;
    }

    #appRoot .fp-class-card > .fp-bar {
      order: 4;
      margin: 0 0 .25rem;
    }

    /* 5 — Weekly pattern stays compact. Keep all seven days visible. */
    #appRoot .fp-class-card > .sr-rhythm {
      order: 5;
      display: flex;
      flex-direction: column;
      margin: .55rem 0 0;
      padding: .7rem .75rem;
    }

    #appRoot .fp-class-card .sr-title {
      order: 0;
      margin: 0 0 .22rem;
    }

    #appRoot .fp-class-card .sr-counts {
      order: 1;
      margin: 0 0 .45rem;
      line-height: 1.5;
      font-size: .82rem;
    }

    #appRoot .fp-class-card .sr-days {
      order: 2;
      margin: 0;
      gap: .15rem;
    }

    #appRoot .fp-class-card .sr-dot {
      margin: .24rem auto;
    }

    #appRoot .fp-class-card .sr-detail {
      min-height: 0;
    }

    /* 6 — Sharing is available, but not required for teacher review. */
    #appRoot .fp-class-card > .fp-actions > [data-fp-share] {
      order: 6;
      align-self: flex-start;
      max-width: 100%;
      min-height: 2.4rem;
      margin: .6rem 0 0;
      white-space: normal;
    }

    @media (max-width: 560px) {
      #appRoot .fp-class-card {
        padding: .88rem .8rem;
      }

      #appRoot .fp-class-card > .fp-coach {
        padding: .75rem .8rem;
      }

      #appRoot .fp-class-card > .fp-times {
        gap: .2rem;
      }

      #appRoot .fp-class-card > .fp-actions > button:not([data-fp-share]) {
        align-self: stretch;
        width: 100%;
        margin-right: 0;
      }

      #appRoot .fp-class-card > .fp-actions > [data-fp-share] {
        align-self: stretch;
        width: 100%;
      }
    }

    /* VNext usability improvements. Existing Progress script owns the data. */
    .vnext-guide {
      border-left: 4px solid #087d75;
    }
    .vnext-guide h2 { margin-bottom: .5rem; }
    .vnext-inline-tip {
      margin: .75rem 0;
      padding: .75rem .9rem;
      background: #eef6f3;
      border: 1px solid #c2ddd4;
      border-radius: .75rem;
      font-size: .92rem;
    }
    .vnext-manual { max-width: 700px; }
    .vnext-manual input[type="date"],
    .vnext-manual input[type="number"],
    .vnext-manual select {
      display: block;
      box-sizing: border-box;
      width: 100%;
      max-width: 520px;
      min-height: 46px;
      padding: .6rem .7rem;
      font: inherit;
      color: #17344d;
      background: white;
      border: 1px solid #c9d7e2;
      border-radius: 10px;
    }
    .vnext-manual input:focus-visible,
    .vnext-manual select:focus-visible {
      outline: 3px solid #ecaa32;
      outline-offset: 2px;
    }
    .vnext-report-label {
      color: #72521a;
      font-size: .78rem;
      font-weight: 700;
    }
    .vnext-small-actions { margin: 0; gap: .4rem; }
    .vnext-backup-strip {
      max-width: 1016px;
      margin: 0 auto 14px;
      padding: 0 18px;
    }
    .vnext-backup-strip details {
      padding: .55rem .8rem;
      border: 1px solid #d8e4e4;
      border-radius: .75rem;
      background: #f3f9f7;
      color: #244d46;
      font-size: .86rem;
    }
    .vnext-backup-strip summary {
      cursor: pointer;
      font-weight: 650;
    }
    /* Keep only the next step and total time visible by default.
       The existing breakdown and weekly rhythm remain in the DOM. */
    #appRoot .fp-class-card:not(.vnext-expanded) > .fp-times,
    #appRoot .fp-class-card:not(.vnext-expanded) > .fp-bar,
    #appRoot .fp-class-card:not(.vnext-expanded) > .sr-rhythm {
      display: none !important;
    }
    #appRoot .fp-class-card > .vnext-details-toggle {
      order: 5;
      align-self: flex-start;
      max-width: 100%;
      margin: .85rem 0 .25rem;
      text-align: left;
      min-height: 44px;
    }
    #appRoot .fp-header > .vnext-progress-manual {
      margin: .65rem 0 0;
      max-width: 100%;
    }
    @media (max-width: 560px) {
      #appRoot .fp-class-card > .vnext-details-toggle,
      #appRoot .fp-header > .vnext-progress-manual {
        width: 100%;
        align-self: stretch;
      }
      .vnext-small-actions { flex-wrap: wrap; }
      .vnext-manual .actions button { width: 100%; }
    }
  </style>
</head>

<body>
  <header class="masthead">
    <div class="brand">
      <span class="logo" aria-hidden="true">S</span>
      <div>
        <span class="eyebrow">STUDY SYSTEM</span>
        <h1>Study Coach</h1>
      </div>
    </div>
    <nav id="navigation" aria-label="Main navigation"></nav>
  </header>

  <main id="appRoot" tabindex="-1">
    <section class="card">
      <h2>Loading your saved classes…</h2>
      <p>Allow the page to finish loading. Do not clear your saved website data.</p>
    </section>
  </main>

  <aside class="sync-strip">
    <span id="syncStatus" role="status"></span>
    <button id="syncNow" class="text-button" type="button">Sync now</button>
  </aside>

  <p id="message" class="message" role="status" aria-live="polite"></p>

  <footer>
    Learn → Retrieval → Crosscheck → Assess.
    Anki is Stage 3 — Assess.
    <br>
    Keep a backup before clearing website data or changing devices.
    <br>
    <span id="coachVersion">Loading coaching version…</span>
  </footer>

  <dialog id="reflectionDialog" aria-labelledby="reflectionTitle"></dialog>
  <input id="backupInput" type="file" accept="application/json,.json" hidden>

  <noscript>
    <p>Enable JavaScript to use Study Coach.</p>
  </noscript>

  <!-- Integrated VNext v2 script order. Legacy data and progress graphs are retained. -->
  <script src="config.js?v=coach-20261006-2"></script>
  <script src="app.js?v=vnext-20261105-3"></script>
  <script src="weekly-rhythm.js?v=weekly-rhythm-20261017-1"></script>
  <script src="progress-v2.js?v=focused-progress-20261016-4"></script>
  <!-- Legacy coaching-consistency display is intentionally not loaded:
       VNext app.js supplies the single data-led recommendation instead.
       The original file remains in the repository and is not deleted. -->
</body>
</html>
